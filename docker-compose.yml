services:
  mysql:
    image: mysql:8.4
    container_name: gre-mysql
    environment:
      MYSQL_ROOT_PASSWORD: gre_root
      MYSQL_DATABASE: gre
      MYSQL_USER: gre
      MYSQL_PASSWORD: gre
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pgre_root"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
